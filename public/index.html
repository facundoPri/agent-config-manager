<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Config Manager</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --card:#fff; --soft:#f5f5f4; --accent:#c2410c; --blue:#2563eb; --on:#16a34a; --warn:#b45309; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --line:#44403c; --card:#292524; --soft:#231f1d; --accent:#fb923c; --blue:#60a5fa; --on:#4ade80; --warn:#fbbf24; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; }
  main { max-width:1040px; margin:0 auto; padding:20px 16px 80px; }
  header { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  h1 { font-size:21px; margin:0; }
  .meta { color:var(--muted); font-size:12px; margin-top:2px; word-break:break-all; }
  button { font:inherit; font-size:13px; padding:6px 11px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button:hover { border-color:var(--muted); }
  button.primary { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  button.small { font-size:12px; padding:2px 8px; }
  button.link { border:0; background:none; padding:0; color:var(--blue); font-size:12px; }
  button:disabled { opacity:.5; cursor:wait; }
  a { color:var(--blue); }
  nav { display:flex; gap:4px; margin:18px 0 12px; border-bottom:1px solid var(--line); overflow-x:auto; }
  nav button { border:0; border-bottom:2px solid transparent; border-radius:0; background:none; padding:8px 12px; color:var(--muted); white-space:nowrap; }
  nav button.on { color:var(--fg); border-bottom-color:var(--accent); font-weight:600; }
  nav .n { font-size:11px; color:var(--muted); margin-left:4px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .bar input[type=search] { flex:1; min-width:200px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  select { font:inherit; font-size:13px; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .chip { font-size:12px; padding:3px 10px; border-radius:99px; }
  .chip.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .list { border:1px solid var(--line); border-radius:10px; background:var(--card); overflow:hidden; margin-bottom:16px; }
  .row { display:grid; grid-template-columns:44px 1fr auto; gap:10px; padding:10px 12px; border-top:1px solid var(--line); align-items:start; }
  .row:first-child { border-top:0; }
  .row.off .name, .row.off .desc { opacity:.5; }
  .name { font-weight:600; font-family:ui-monospace, monospace; font-size:13px; word-break:break-all; }
  .name a { color:inherit; text-decoration:none; }
  .name a:hover { text-decoration:underline; }
  .desc { color:var(--muted); font-size:12.5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .mono { font-family:ui-monospace, monospace; font-size:12px; color:var(--muted); word-break:break-all; }
  .tags { display:flex; gap:5px; flex-wrap:wrap; margin-top:5px; }
  .tag { font-size:11px; padding:0 7px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .tag.agent { color:var(--accent); border-color:var(--accent); }
  .tag.warn { color:var(--warn); border-color:var(--warn); }
  .tag.ok { color:var(--on); border-color:var(--on); }
  .acts { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .sub { margin:8px 0 0; display:grid; gap:4px; }
  .sub .item { display:flex; justify-content:space-between; gap:8px; align-items:center; padding:4px 8px; background:var(--soft); border-radius:6px; }
  .sw { position:relative; width:38px; height:22px; margin-top:1px; display:inline-block; }
  .sw input { opacity:0; width:0; height:0; }
  .sw span { position:absolute; inset:0; border-radius:99px; background:var(--line); cursor:pointer; transition:.15s; }
  .sw span::after { content:""; position:absolute; left:3px; top:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:.15s; }
  .sw input:checked + span { background:var(--on); }
  .sw input:checked + span::after { transform:translateX(16px); }
  .sw input:disabled + span { opacity:.5; cursor:wait; }
  h3 { font-size:13px; margin:18px 0 6px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .empty { padding:14px; color:var(--muted); }
  .note { color:var(--muted); font-size:12px; margin:8px 0 14px; }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:8px 14px; border-radius:8px; font-size:13px; display:none; max-width:90vw; z-index:20; white-space:pre-line; }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--fg); padding:0; width:min(760px, calc(100vw - 32px)); max-height:calc(100vh - 48px); }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  .dlg { padding:18px; }
  .dlg h2 { margin:0 0 4px; font-size:18px; font-family:ui-monospace, monospace; word-break:break-all; }
  .dlg pre { background:var(--soft); padding:12px; border-radius:8px; overflow:auto; max-height:50vh; font-size:12px; white-space:pre-wrap; }
  .dlg label { display:flex; gap:8px; align-items:center; margin:6px 0; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:12px; }
  .kbd { font-family:ui-monospace, monospace; font-size:11px; border:1px solid var(--line); border-radius:4px; padding:0 4px; }
  .card { border:1px solid var(--line); border-radius:10px; background:var(--card); padding:14px; margin-bottom:16px; }
  .cmd { display:flex; gap:8px; align-items:center; margin:8px 0 2px; }
  .cmd code { flex:1; font-family:ui-monospace, monospace; font-size:12px; background:var(--soft); padding:7px 10px; border-radius:8px; overflow-x:auto; white-space:nowrap; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--muted); margin-right:6px; }
  .dot.on { background:var(--on); box-shadow:0 0 0 3px color-mix(in srgb, var(--on) 25%, transparent); }
  .row.click { cursor:pointer; } .row.click:hover { background:var(--soft); }
  .row.sel { background:var(--soft); box-shadow:inset 3px 0 0 var(--accent); }
  .stack { display:flex; height:22px; border-radius:6px; overflow:hidden; margin:8px 0 10px; background:var(--soft); }
  .stack div { height:100%; min-width:2px; }
  .sw8 { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  table.t { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.t td, table.t th { text-align:left; padding:6px 8px; border-top:1px solid var(--line); vertical-align:top; }
  table.t th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.03em; border-top:0; }
  table.t td.n, table.t th.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  table.t tr.click { cursor:pointer; } table.t tr.click:hover td { background:var(--soft); }
  table.t tr.sel td { background:var(--soft); }
  details > summary { cursor:pointer; }
  .msg { border-top:1px solid var(--line); padding:8px 0; }
  .msg .who { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .dlg pre.small { max-height:30vh; }
  .back { margin-bottom:10px; }
  @media (max-width:600px) { .row { grid-template-columns:44px 1fr; } .acts { grid-column:2; justify-content:flex-start; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Agent Config Manager</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="acts">
      <button onclick="load()">Recargar</button>
      <button class="primary" onclick="openClean()">Arrancar limpio…</button>
    </div>
  </header>
  <nav id="tabs"></nav>
  <div class="bar">
    <input type="search" id="q" placeholder="Buscar…  (atajo: /)">
    <select id="estado"><option value="">Prendidas y archivadas</option><option value="on">Solo prendidas</option><option value="off">Solo archivadas</option><option value="norepo">Skills sin repo ni origen</option></select>
  </div>
  <div class="chips" id="chips"></div>
  <div id="out"></div>
</main>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast"></div>

<script>
let S = null;
let L = null, LS = null, LR = null; // logger: estado y sesiones, sesión abierta, pedido elegido
let tab = 'skills', agent = '', q = '', estado = '';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const enc = (v) => esc(JSON.stringify(v));
const has = (...xs) => !q || xs.some((x) => String(x ?? '').toLowerCase().includes(q));
const tilde = (p) => S && p && p.startsWith(S.home + '/') ? '~' + p.slice(S.home.length) : p;

function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = 'none'), 4500); }

async function load() { S = await (await fetch('/api/state')).json(); render(); route(); loadLogger(); }

async function post(url, body, btn) {
  if (btn) btn.disabled = true;
  try {
    const r = await fetch(url, { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) { toast('Error: ' + j.error); render(); return null; }
    if (j.state) { S = j.state; render(); }
    const msg = [j.done?.length ? 'Listo: ' + j.done.slice(0, 6).join(', ') + (j.done.length > 6 ? ` y ${j.done.length - 6} más` : '') : '', ...(j.errors || []).map((e) => 'Ojo: ' + e)].filter(Boolean).join('\n');
    if (msg) toast(msg);
    return j;
  } finally { if (btn) btn.disabled = false; }
}
const archiveTargets = (targets, label, btn) => post('/api/archive', { targets, label }, btn);
const restoreRefs = (refs, btn) => post('/api/restore', { refs }, btn);
const openPath = (path, reveal, btn) => post('/api/open', { path, reveal }, btn);

// ---------- filtros ----------
const TABS = [['skills', 'Skills'], ['plugins', 'Plugins'], ['mcps', 'MCPs'], ['hooks', 'Hooks'], ['logger', 'Logger'], ['rutas', 'Rutas'], ['archivo', 'Archivo'], ['copias', 'Copias']];
function counts() {
  return { skills: S.skills.length + S.archived.skills.length, plugins: S.plugins.length, mcps: S.mcps.length + S.archived.mcps.length,
    hooks: S.hooks.length + S.archived.hooks.length, logger: L ? L.sessions.length : '', rutas: S.paths.reduce((n, g) => n + g.items.filter((i) => i.exists).length, 0), archivo: S.snapshots.length, copias: S.backups.length };
}
function agentOk(list) { return !agent || (list || []).includes(agent); }
function stateOk(on) { return !estado || estado === 'norepo' || (estado === 'on') === on; }
// Una skill está respaldada si vive en un repo git o vino de npx skills (se puede reinstalar).
const backedUp = (s) => !!(s.git || s.links?.github);

function visibleSkills() {
  return [...S.skills, ...S.archived.skills]
    .filter((s) => agentOk(s.seenBy) && stateOk(s.enabled) && (estado !== 'norepo' || (s.enabled && !backedUp(s))) && has(s.name, s.description, s.dir, s.via))
    .sort((a, b) => a.name.localeCompare(b.name));
}
const toolAgents = (tool) => [tool];
function visibleMcps() { return [...S.mcps, ...S.archived.mcps].filter((m) => agentOk(toolAgents(m.tool)) && stateOk(m.enabled) && has(m.name, m.detail, m.fileShort, m.tool)); }
function visibleHooks() { return [...S.hooks, ...S.archived.hooks].filter((h) => agentOk(toolAgents(h.tool)) && stateOk(h.enabled) && has(h.event, h.matcher, h.commands.join(' '), h.fileShort)); }
function visiblePlugins() {
  return S.plugins.filter((p) => (!agent || agent === 'Claude Code') && stateOk(p.enabled) &&
    has(p.plugin, p.description, ...p.skills.map((s) => s.name + ' ' + s.description), ...p.mcp, ...p.commands, ...p.agents));
}

// ---------- render ----------
function render() {
  $('meta').innerHTML = `home <b>${esc(S.home)}</b> · proyecto <b>${esc(tilde(S.project))}</b> · archivo <b>${esc(S.archive)}</b>` +
    (S.claudeCli ? ' · plugins vía CLI <span class="kbd">claude</span>' : ' · plugins vía settings.json');
  const c = counts();
  $('tabs').innerHTML = TABS.map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" onclick="go('${k}')">${l}<span class="n">${c[k]}</span></button>`).join('');
  $('chips').innerHTML = ['', ...S.agents].map((a) => `<button class="chip ${a === agent ? 'on' : ''}" onclick="agent='${a}';render()">${a || 'Todos los agentes'}</button>`).join('');
  $('chips').style.display = $('estado').style.display = ['skills', 'plugins', 'mcps', 'hooks'].includes(tab) ? '' : 'none';
  $('q').closest('.bar').style.display = tab === 'logger' && LS ? 'none' : '';
  $('out').innerHTML = ({ skills: renderSkills, plugins: renderPlugins, mcps: renderMcps, hooks: renderHooks, logger: renderLogger, rutas: renderPaths, archivo: renderArchive, copias: renderBackups })[tab]();
}
function go(t) { tab = t; if (t === 'logger') { LS = LR = null; loadLogger(); } if (!location.hash.startsWith('#/skill/')) history.replaceState(null, '', '#/' + t); render(); }

const sw = (on, onchange) => `<label class="sw"><input type="checkbox" ${on ? 'checked' : ''} onchange="${esc(onchange)}"><span></span></label>`;
const tags = (xs) => `<div class="tags">${xs.filter(Boolean).join('')}</div>`;
const tag = (t, cls = '') => `<span class="tag ${cls}">${esc(t)}</span>`;
const bulkBar = (n, onArchive, onRestore, nOff) => `<div class="bar">
  <span class="note" style="margin:0">${n} a la vista</span>
  ${n - nOff ? `<button class="small" onclick="${esc(onArchive)}">Archivar las ${n - nOff} prendidas que se ven</button>` : ''}
  ${nOff ? `<button class="small" onclick="${esc(onRestore)}">Restaurar las ${nOff} archivadas que se ven</button>` : ''}</div>`;

function gitTag(s) {
  if (!s.enabled) return '';
  if (s.git) return `<span class="tag ${s.git.status === 'al día' ? 'ok' : 'warn'}" title="${esc(s.git.root)}">git: ${esc(s.git.url ? s.git.url.replace('https://github.com/', '') : s.git.root)} · ${esc(s.git.status)}</span>`;
  return s.links?.github ? '' : tag('sin repo: solo vive acá', 'warn');
}

function skillRow(s) {
  const toggle = s.enabled
    ? `archiveTargets([{kind:'skill',path:${JSON.stringify(s.path)}}], 'skill-${s.folder}', this)`
    : `restoreRefs([${JSON.stringify(s.ref)}], this)`;
  const href = '#/skill/' + encodeURIComponent(s.name);
  return `<div class="row ${s.enabled ? '' : 'off'}">
    ${sw(s.enabled, toggle)}
    <div>
      <div class="name"><a href="${href}">${esc(s.name)}</a></div>
      <div class="desc">${esc(s.description)}</div>
      ${tags([...s.seenBy.map((a) => tag(a, 'agent')), tag(s.dir), tag(s.scope), tag(s.via, s.via === 'enlace roto' ? 'warn' : ''),
        gitTag(s), ...(s.alsoAt || []).map((p) => tag('también en ' + p)), ctxTag(s)])}
    </div>
    <div class="acts">
      <button class="small" onclick="location.hash='${href}'">Ver</button>
      ${s.enabled ? `<button class="small" onclick='openPath(${enc(s.path)}, false, this)'>VS Code</button>` : ''}
      ${s.links?.github ? `<a class="small" href="${esc(s.links.github)}" target="_blank" rel="noopener">GitHub</a>` : ''}
    </div>
  </div>`;
}

function renderSkills() {
  const list = visibleSkills();
  const on = list.filter((s) => s.enabled), off = list.filter((s) => !s.enabled);
  window._vis = { on: on.map((s) => ({ kind: 'skill', path: s.path })), off: off.map((s) => s.ref) };
  return contextNote() + bulkBar(list.length, `archiveTargets(_vis.on, 'skills', this)`, `restoreRefs(_vis.off, this)`, off.length) +
    `<div class="list">${list.map(skillRow).join('') || '<div class="empty">No hay skills con este filtro.</div>'}</div>
    <p class="note">Apagar una skill la mueve al archivo (no se borra) y la podés prender de nuevo cuando quieras. "Visible en" junta todos los agentes que la cargan: <span class="kbd">npx skills</span> deja la carpeta real en <span class="kbd">~/.agents/skills</span> (Codex, OpenCode, Gemini) y un enlace en <span class="kbd">~/.claude/skills</span>.</p>`;
}

function renderPlugins() {
  const list = visiblePlugins();
  const archivedRefs = Object.fromEntries(S.archived.plugins.map((p) => [p.plugin, p.ref]));
  if (!S.plugins.length) return `<div class="list"><div class="empty">No hay plugins de Claude Code instalados.</div></div>`;
  return `<div class="list">${list.map((p) => {
    const toggle = !p.enabled && archivedRefs[p.plugin] ? `restoreRefs([${JSON.stringify(archivedRefs[p.plugin])}], this)` : `post('/api/plugin', {plugin:${JSON.stringify(p.plugin)}, on:${!p.enabled}}, this)`;
    const sub = (title, xs) => xs.length ? `<div class="mono">${title}: ${xs.map(esc).join(', ')}</div>` : '';
    return `<div class="row ${p.enabled ? '' : 'off'}">
      ${sw(p.enabled, toggle)}
      <div>
        <div class="name">${esc(p.plugin)}</div>
        <div class="desc">${esc(p.description)}</div>
        ${tags([tag('Claude Code', 'agent'), p.version && tag('v' + p.version), p.scope && tag(p.scope), archivedRefs[p.plugin] && tag('apagado al arrancar limpio', 'warn'),
          tag(p.skills.length + ' skills'), p.mcp.length && tag(p.mcp.length + ' MCPs'), p.hooks.length && tag('hooks: ' + p.hooks.join(', ')),
          p.commands.length && tag(p.commands.length + ' comandos'), p.agents.length && tag(p.agents.length + ' agentes')])}
        <div class="sub">
          ${p.skills.filter((s) => has(p.plugin, s.name, s.description)).map((s) => `<div class="item">
            <div><span class="name"><a href="#/plugin-skill/${encodeURIComponent(p.plugin)}/${encodeURIComponent(s.folder)}">${esc(s.name)}</a></span> <span class="desc" style="display:inline">${esc(s.description.slice(0, 120))}</span></div>
            <button class="small" title="Copia la skill a ~/.claude/skills para usarla sin el plugin" onclick='post("/api/copy-skill", {plugin:${enc(p.plugin)}, folder:${enc(s.folder)}}, this)'>Usar sin el plugin</button>
          </div>`).join('')}
          ${sub('MCPs', p.mcp)}${sub('Comandos', p.commands.map((c) => '/' + c))}${sub('Agentes', p.agents)}
        </div>
      </div>
      <div class="acts">
        ${p.installPath ? `<button class="small" onclick='openPath(${enc(p.installPath)}, false, this)'>VS Code</button>` : ''}
        ${p.url ? `<a class="small" href="${esc(p.url)}" target="_blank" rel="noopener">Página</a>` : ''}
      </div>
    </div>`;
  }).join('') || '<div class="empty">No hay plugins con este filtro.</div>'}</div>
  <p class="note">Claude Code prende y apaga plugins enteros: no deja apagar una skill suelta de un plugin. Si querés solo algunas, usá "Usar sin el plugin" en esas y después apagá el plugin.</p>`;
}

function renderMcps() {
  const list = visibleMcps();
  const on = list.filter((m) => m.enabled), off = list.filter((m) => !m.enabled);
  window._vis = { on: on.map((m) => m.target), off: off.map((m) => m.ref) };
  const fromPlugins = S.plugins.filter((p) => p.mcp.length && (!agent || agent === 'Claude Code'));
  return bulkBar(list.length, `archiveTargets(_vis.on, 'mcps', this)`, `restoreRefs(_vis.off, this)`, off.length) +
    `<div class="list">${list.map((m) => `<div class="row ${m.enabled ? '' : 'off'}">
      ${sw(m.enabled, m.enabled ? `archiveTargets([${JSON.stringify(m.target)}], 'mcp-${m.name}', this)` : `restoreRefs([${JSON.stringify(m.ref)}], this)`)}
      <div><div class="name">${esc(m.name)}</div><div class="mono">${esc(m.detail)}</div>
        ${tags([tag(m.tool, 'agent'), tag(m.scope), tag(m.fileShort), m.transport && tag(m.transport), m.disabledInConfig && tag('desactivado en el archivo', 'warn'), !m.enabled && tag('archivado en ' + m.snapshot)])}</div>
      <div class="acts">${m.file ? `<button class="small" onclick='openPath(${enc(m.file)}, false, this)'>VS Code</button>` : ''}</div>
    </div>`).join('') || '<div class="empty">No hay MCPs con este filtro.</div>'}</div>
    ${fromPlugins.length ? `<h3>MCPs que traen los plugins</h3><div class="list">${fromPlugins.map((p) => `<div class="row"><div></div><div><div class="name">${esc(p.mcp.join(', '))}</div>${tags([tag('plugin ' + p.plugin), tag(p.enabled ? 'prendido' : 'apagado')])}</div><div></div></div>`).join('')}</div>` : ''}
    <p class="note">Archivar un MCP lo saca de su archivo de configuración y lo guarda en el archivo; restaurarlo lo vuelve a poner igual. Antes de tocar un archivo se guarda una copia en <span class="kbd">${esc(S.archive)}/.backups</span>. Cerrá Claude Code antes de tocar los MCPs de usuario: guarda <span class="kbd">~/.claude.json</span> al salir.</p>`;
}

function renderHooks() {
  const list = visibleHooks();
  const on = list.filter((h) => h.enabled), off = list.filter((h) => !h.enabled);
  window._vis = { on: on.map((h) => h.target), off: off.map((h) => h.ref) };
  const fromPlugins = S.plugins.filter((p) => p.hooks.length && (!agent || agent === 'Claude Code'));
  return bulkBar(list.length, `archiveTargets(_vis.on, 'hooks', this)`, `restoreRefs(_vis.off, this)`, off.length) +

function restoreBackup(name, withFiles, btn) {

// ---------- página de una skill ----------
async function showSkill(s, extra = '') {
  const d = s.skillMd ? await (await fetch('/api/skill?file=' + encodeURIComponent(s.skillMd))).json() : { content: '', files: [] };
  $('dlgBody').innerHTML = `<h2>${esc(s.name)}</h2>
    <div class="desc" style="-webkit-line-clamp:unset">${esc(s.description)}</div>
    ${tags([...(s.seenBy || []).map((a) => tag(a, 'agent')), s.dir && tag(s.dir), s.via && tag(s.via), s.enabled !== undefined && gitTag(s), extra && tag(extra)])}
    <p class="mono">${esc(tilde(d.dir || s.path || ''))}</p>
    <div class="acts" style="justify-content:flex-start">
      ${d.dir ? `<button onclick='openPath(${enc(d.dir)}, false, this)'>Abrir en VS Code</button><button onclick='openPath(${enc(d.dir)}, true, this)'>Mostrar carpeta</button>` : ''}
      ${s.links?.github ? `<a href="${esc(s.links.github)}" target="_blank" rel="noopener">GitHub</a>` : ''}
      ${s.links?.skillsSh ? `<a href="${esc(s.links.skillsSh)}" target="_blank" rel="noopener">skills.sh</a>` : ''}
      <button onclick='navigator.clipboard.writeText(location.href).then(() => toast("Link copiado"))'>Copiar link a esta página</button>
      <button onclick="closeDlg()">Cerrar</button>
    </div>
    ${d.files?.length ? `<h3>Archivos</h3><div class="mono">${d.files.map(esc).join(' · ')}</div>` : ''}
    <h3>SKILL.md</h3><pre>${esc(d.content || d.error || '')}</pre>`;
  if (!$('dlg').open) $('dlg').showModal();
}
function closeDlg() { $('dlg').close(); }
$('dlg').addEventListener('close', () => { if (/^#\/(plugin-)?skill\//.test(location.hash)) history.replaceState(null, '', LS ? '#/logger/' + LS.session + (LR ? '/' + LR.record.id : '') : '#/' + tab); });

function route() {
  const h = decodeURIComponent(location.hash);
  let m;
  if ((m = h.match(/^#\/skill\/(.+)$/))) {
    const s = [...S.skills, ...S.archived.skills].find((x) => x.name === m[1] || x.folder === m[1]);
    if (s) showSkill(s); else toast('No encuentro la skill ' + m[1]);
  } else if ((m = h.match(/^#\/plugin-skill\/([^/]+)\/(.+)$/))) {
    const p = S.plugins.find((x) => x.plugin === m[1]);
    const s = p?.skills.find((x) => x.folder === m[2]);
    if (s) showSkill({ ...s, skillMd: s.path + '/SKILL.md', seenBy: ['Claude Code'], dir: 'plugin ' + p.plugin, via: p.enabled ? 'plugin prendido' : 'plugin apagado', links: { github: p.url } });
  } else if ((m = h.match(/^#\/logger\/([\w.-]+)(?:\/([\w.-]+))?$/))) { tab = 'logger'; openSession(m[1], m[2]); }
  else if ((m = h.match(/^#\/(\w+)$/)) && TABS.some(([k]) => k === m[1])) { tab = m[1]; if (tab === 'logger') { LS = LR = null; loadLogger(); } render(); }
}
window.addEventListener('hashchange', route);

function openClean() {
  const n = { skills: S.skills.filter((s) => s.scope === 'personal').length, skillsP: S.skills.filter((s) => s.scope === 'proyecto').length,
    plugins: S.plugins.filter((p) => p.enabled).length, mcps: S.mcps.length, hooks: S.hooks.length };
  $('dlgBody').innerHTML = `<h2 style="font-family:inherit">Arrancar limpio</h2>
    <p class="note">Archiva todo lo marcado en una sola carpeta del archivo. Después lo devolvés entero desde la pestaña Archivo con "Restaurar todo".</p>
    <label><input type="checkbox" id="c-skills" checked> Skills personales (${n.skills})</label>
    <label><input type="checkbox" id="c-skillsP"> Skills del proyecto (${n.skillsP})</label>
    <label><input type="checkbox" id="c-plugins" checked> Apagar plugins de Claude Code (${n.plugins})</label>
    <label><input type="checkbox" id="c-mcps"> MCPs (${n.mcps})</label>
    <label><input type="checkbox" id="c-hooks"> Hooks (${n.hooks})</label>
    <label><input type="checkbox" id="c-backup" checked> Hacer una copia de seguridad antes</label>
    <label>Solo de <select id="c-agent"><option value="">todos los agentes</option>${S.agents.map((a) => `<option>${esc(a)}</option>`).join('')}</select></label>
    <div class="acts" style="justify-content:flex-start;margin-top:12px">
      <button class="primary" onclick="doClean(this)">Archivar</button><button onclick="closeDlg()">Cancelar</button></div>`;
  $('dlg').showModal();
}
async function doClean(btn) {
  const on = (id) => $(id).checked, a = $('c-agent').value;
  const ok = (list) => !a || list.includes(a);
  const t = [];
  if (on('c-skills')) t.push(...S.skills.filter((s) => s.scope === 'personal' && ok(s.seenBy)).map((s) => ({ kind: 'skill', path: s.path })));
  if (on('c-skillsP')) t.push(...S.skills.filter((s) => s.scope === 'proyecto' && ok(s.seenBy)).map((s) => ({ kind: 'skill', path: s.path })));
  if (on('c-plugins') && ok(['Claude Code'])) t.push(...S.plugins.filter((p) => p.enabled).map((p) => ({ kind: 'plugin', plugin: p.plugin })));
  if (on('c-mcps')) t.push(...S.mcps.filter((m) => ok([m.tool])).map((m) => m.target));
  if (on('c-hooks')) t.push(...S.hooks.filter((h) => ok([h.tool])).map((h) => h.target));
  if (!t.length) return toast('No hay nada para archivar con esa selección.');
  if (on('c-backup') && !(await post('/api/backup', { label: 'antes-de-arrancar-limpio' }, btn))) return;
  // Una skill enlazada desde dos carpetas se archiva una vez por carpeta: está bien, cada enlace vuelve a su lugar.
  const r = await archiveTargets(t, 'arrancar-limpio' + (a ? '-' + a : ''), btn);
  if (r) { closeDlg(); go('archivo'); }
}

// ---------- logger ----------
const fmt = (n) => n == null ? '—' : n >= 1000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1).replace('.', ',') + 'k' : String(n);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const pct = (a, b) => b ? Math.round((100 * a) / b) + '%' : '';
const ago = (ts) => { const s = (Date.now() - new Date(ts)) / 1000; return s < 60 ? 'recién' : s < 3600 ? `hace ${Math.round(s / 60)} min` : s < 86400 ? `hace ${Math.round(s / 3600)} h` : new Date(ts).toLocaleString(); };
const hhmm = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const clip = (t, n = 20000) => (t = String(t ?? '')).length > n ? t.slice(0, n) + `\n… (${fmt(t.length - n)} caracteres más)` : t;
const copy = (text) => navigator.clipboard.writeText(text).then(() => toast('Copiado'));
const CAT_COLORS = { system: '#78716c', tools: '#2563eb', mcp: '#7c3aed', skills: '#c2410c', skillLoaded: '#f97316', memory: '#16a34a', harness: '#a8a29e',
  mcpInstr: '#a78bfa', reminders: '#d6d3d1', user: '#0891b2', assistant: '#0d9488', toolCalls: '#ca8a04', toolResults: '#facc15' };
const AGENT_LABEL = { 'claude-code': 'Claude Code', codex: 'Codex' };

async function getJson(url) {
  const r = await fetch(url), j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function loadLogger() {
  try { L = await getJson('/api/logger'); } catch { return; }
  if (tab === 'logger' && !LS) render();
}
async function loggerPost(action, btn) {
  btn.disabled = true;
  try {
    const r = await fetch('/api/logger/' + action, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ port: $('lport')?.value }) });
    const j = await r.json();
    if (!r.ok) return toast('Error: ' + j.error);
    L = j; render();
  } finally { btn.disabled = false; }
}
// Mientras el logger está prendido, la pestaña se actualiza sola.
setInterval(async () => {
  if (document.hidden || tab !== 'logger' || !L?.status.running) return;
  if (!LS) return loadLogger();
  let d; try { d = await getJson('/api/logger/session?id=' + encodeURIComponent(LS.session)); } catch { return; }
  if (d.requests.length === LS.requests.length) return;
  const follow = !LR || LR.record.id === LS.lastMain;
  LS = d;
  if (follow && d.lastMain !== LR?.record.id) selectRequest(d.lastMain, false); else render();
}, 3000);

function renderLogger() {
  if (!L) return '<div class="empty">Cargando…</div>';
  if (LS) return renderSession();
  const st = L.status;
  const sessions = L.sessions.filter((s) => has(s.title, s.cwd, s.session, ...s.models));
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start">
      <div><span class="dot ${st.running ? 'on' : ''}"></span><b>${st.running ? `Escuchando en localhost:${st.port}` : 'Apagado'}</b>
        <div class="note" style="margin:4px 0 0">Se pone entre tu agente y la API del modelo: reenvía todo igual (con tu login) y guarda una copia de cada pedido, así ves el contexto que recibe el modelo de verdad, subagentes incluidos.</div></div>
      <div class="acts">${st.running ? `<button onclick="loggerPost('stop', this)">Apagar</button>`
        : `<label class="note" style="margin:0;display:flex;gap:6px;align-items:center">Puerto <input id="lport" value="${st.port}" size="5" style="font:inherit;padding:5px 7px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)"></label><button class="primary" onclick="loggerPost('start', this)">Prender</button>`}</div>
    </div>
    ${st.lastError ? `<p class="note" style="color:var(--warn)">Último error: ${esc(st.lastError)}</p>` : ''}
    ${st.commands.map((c) => `<h3>${esc(c.label)}${c.beta ? ' · en prueba' : ''}</h3>
      <div class="cmd"><code>${esc(c.command)}</code><button class="small" onclick='copy(${enc(c.command)})'>Copiar</button></div>
      <div class="note" style="margin:4px 0 0">${esc(c.note)}</div>`).join('')}
    <p class="note">${st.running ? 'Corré el comando en otra terminal, en la carpeta del proyecto. La sesión aparece abajo y se actualiza sola.' : 'Prendelo y después corré el comando en otra terminal.'}
      Los logs quedan en <span class="kbd">${esc(tilde(st.logs))}</span> <button class="link" onclick='openPath(${enc(st.logs)}, true, this)'>Mostrar</button></p>
  </div>
  <h3>Sesiones</h3>
  <div class="list">${sessions.map((s) => `<div class="row click" style="grid-template-columns:1fr auto" onclick="location.hash='#/logger/${s.session}'">
      <div><div class="name" style="font-family:inherit">${esc(s.title.slice(0, 160))}</div>
        ${tags([tag(AGENT_LABEL[s.agent] || s.agent, 'agent'), s.cwd && tag(tilde(s.cwd)), tag(plural(s.requests, 'pedido', 'pedidos')), s.subagents && tag(plural(s.subagents, 'subagente', 'subagentes')),
          tag('contexto ≈' + fmt(s.ctx) + ' tokens'), ...s.models.map((m) => tag(m)), s.errors && tag(s.errors + ' con error', 'warn')])}</div>
      <div class="note" style="margin:0;white-space:nowrap">${ago(s.lastSeen)}</div></div>`).join('')
    || `<div class="empty">Todavía no hay sesiones. ${st.running ? 'Corré el comando de arriba.' : 'Prendé el logger.'}</div>`}</div>`;
}

async function openSession(id, reqId) {
  if (!L) await loadLogger();
  try { LS = await getJson('/api/logger/session?id=' + encodeURIComponent(id)); }
  catch (e) { toast('Error: ' + e.message); LS = null; render(); return; }
  LR = null;
  await selectRequest(reqId && LS.requests.some((r) => r.id === reqId) ? reqId : LS.lastMain, false);
}
async function selectRequest(id, push = true) {
  try { LR = await getJson(`/api/logger/request?session=${encodeURIComponent(LS.session)}&id=${encodeURIComponent(id)}`); }
  catch (e) { return toast('Error: ' + e.message); }
  if (push) history.replaceState(null, '', `#/logger/${LS.session}/${id}`);
  render();
}
function selectThreadLast(thread) { const r = LS.requests.filter((x) => x.thread === thread).pop(); if (r) selectRequest(r.id); }
const threadOf = (r) => LS.threads.find((t) => t.id === r.thread);
function threadShort(r) {
  const t = threadOf(r);
  if (!t || t.kind === 'principal') return 'Principal';
  if (t.kind === 'auxiliar') return 'Auxiliar' + (r.auxLabel ? ': ' + r.auxLabel.slice(0, 40) + '…' : '');
  return 'Subagente' + (t.spawn?.type ? ' ' + t.spawn.type : '');
}

function renderSession() {
  const s = LS, sel = LR?.record.id;
  const head = s.requests.find((r) => r.thread === 'main') || s.requests[0];
  const selThread = s.requests.find((r) => r.id === sel)?.thread;
  return `<div class="back"><button class="small" onclick="location.hash='#/logger'">← Sesiones</button></div>
    <h2 style="margin:0 0 4px;font-size:17px">${esc((head.firstPrompt || s.session).slice(0, 200))}</h2>
    ${tags([tag(AGENT_LABEL[head.agent] || head.agent, 'agent'), head.cwd && tag(tilde(head.cwd)), tag(plural(s.requests.length, 'pedido', 'pedidos')), tag('empezó ' + new Date(s.meta.firstSeen || head.ts).toLocaleString()),
      L?.status.running ? tag('en vivo') : ''])}
    <h3>Hilos</h3>
    <div class="list">${s.threads.map((t) => `<div class="row ${t.id === selThread ? 'sel' : ''}" style="grid-template-columns:1fr auto"><div>
        <div class="name" style="font-family:inherit">${esc(t.label)}</div>
        ${t.spawn ? `<div class="desc">Lo lanzó el hilo principal con: ${esc(t.spawn.prompt)}</div>` : ''}
        ${tags([tag(t.kind, t.kind === 'subagente' ? 'agent' : ''), tag(plural(t.requests, 'pedido', 'pedidos')), tag('último contexto ≈' + fmt(t.ctx)), tag('salida ' + fmt(t.output) + ' tokens'), ...t.models.map((m) => tag(m))])}</div>
        <div class="acts"><button class="small" onclick="selectThreadLast(${enc(t.id)})">Ver su contexto</button></div></div>`).join('')}</div>
    ${LR ? renderContext() : ''}
    <h3>Pedidos (el más nuevo arriba)</h3>
    <div class="list" style="overflow-x:auto"><table class="t">
      <tr><th class="n">Hora</th><th>Hilo</th><th>Modelo</th><th class="n">Contexto</th><th class="n">De caché</th><th class="n">Salida</th><th>Qué hizo</th></tr>
      ${s.requests.slice().reverse().map((r) => `<tr class="click ${r.id === sel ? 'sel' : ''}" onclick="selectRequest('${r.id}')">
        <td class="n">${hhmm(r.ts)}</td><td>${esc(threadShort(r))}</td><td class="mono">${esc(r.model)}</td>
        <td class="n">${fmt(r.ctx)}</td><td class="n">${r.usage ? pct(r.usage.cacheRead, r.ctx) || '0%' : '—'}</td><td class="n">${fmt(r.usage?.output)}</td>
        <td>${r.error || r.status >= 400 ? `<span class="tag warn">${r.status} ${esc((r.error || '').slice(0, 80))}</span>`
          : r.toolsCalled.length ? r.toolsCalled.map((n) => tag(n)).join(' ') : `<span class="desc">${esc((r.reply || '').slice(0, 100))}</span>`}</td></tr>`).join('')}
    </table></div>`;
}

function renderContext() {
  const { record: r, context: c } = LR;
  const sum = LS.requests.find((x) => x.id === r.id) || {};
  const total = c.total || 1;
  const rows = c.cats.map((k) => `<tr><td><details><summary><span class="sw8" style="background:${CAT_COLORS[k.key]}"></span>${esc(k.label)} <span class="note">(${k.items.length})</span></summary>
      <table class="t" style="margin-top:6px">${k.items.slice(0, 80).map((i) => `<tr><td class="mono">${esc(i.name)}</td><td class="n">≈${fmt(i.tokens)}</td></tr>`).join('')}
      ${k.items.length > 80 ? `<tr><td class="note">y ${k.items.length - 80} más</td><td></td></tr>` : ''}</table></details></td>
      <td class="n">≈${fmt(k.tokens)}</td><td class="n">${pct(k.tokens, total)}</td></tr>`).join('');
  return `<h3>Contexto del pedido de las ${hhmm(r.ts)} · ${esc(threadShort(sum))}</h3>
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center">
        <div><b>${fmt(c.total)} tokens</b> de entrada${c.usage ? ` · ${fmt(c.usage.cacheRead)} leídos de caché · ${fmt(c.usage.cacheWrite)} escritos en caché · ${fmt(c.usage.output)} de salida` : ' (estimado, sin respuesta de la API)'}</div>
        <div class="acts"><button class="small" onclick="showRequest()">Ver pedido completo</button></div></div>
      <div class="stack">${c.cats.map((k) => `<div title="${esc(k.label)}: ≈${fmt(k.tokens)}" style="width:${(100 * k.tokens) / total}%;background:${CAT_COLORS[k.key]}"></div>`).join('')}</div>
      <table class="t">${rows}</table>
      ${c.deferred.length ? `<p class="note">${c.deferred.length} herramienta(s) diferida(s): se mandan pero no ocupan contexto hasta que el modelo las busca con ToolSearch.</p>` : ''}
      <p class="note">Cada pedido manda el contexto entero de nuevo. Los números por categoría son una estimación (caracteres ÷ 4) ajustada al total real que devolvió la API.</p>
    </div>
    ${renderContextSkills(c, total)}`;
}

// Une una skill de la lista que vio el modelo con lo que la app encuentra en disco.
function matchSkill(name) {
  const local = S.skills.find((s) => s.name === name || s.folder === name);
  if (local) return { kind: 'local', s: local };
  if (name.includes(':')) {
    const [plug, sk] = name.split(':');
    const p = S.plugins.find((x) => x.plugin === plug || x.plugin.split('@')[0] === plug);
    if (p) return { kind: 'plugin', p, s: p.skills.find((x) => x.name === sk || x.folder === sk) };
  }
  const arch = S.archived.skills.find((s) => s.name === name || s.folder === name);
  return arch ? { kind: 'archived', s: arch } : null;
}
function renderContextSkills(c, total) {
  if (!c.skills.length && !c.loaded.length) return '';
  const sum = c.skills.reduce((n, s) => n + s.tokens, 0);
  const rows = c.skills.slice().sort((a, b) => b.tokens - a.tokens).map((sk) => {
    const m = matchSkill(sk.name);
    let where = '', acts = '';
    if (m?.kind === 'local') {
      where = tags([...m.s.seenBy.map((a) => tag(a, 'agent')), tag(m.s.dir), tag(m.s.scope)]);
      acts = `<button class="small" onclick="location.hash='#/skill/${encodeURIComponent(m.s.name)}'">Ver</button>
        <button class="small" onclick='archiveTargets([{kind:"skill",path:${enc(m.s.path)}}], ${enc('skill-' + m.s.folder)}, this)'>Archivar</button>`;
    } else if (m?.kind === 'plugin') {
      where = tags([tag('plugin ' + m.p.plugin), tag(m.p.enabled ? 'plugin prendido' : 'plugin apagado')]);
      acts = (m.s ? `<button class="small" onclick="location.hash='#/plugin-skill/${encodeURIComponent(m.p.plugin)}/${encodeURIComponent(m.s.folder)}'">Ver</button>` : '') + `<button class="small" onclick="go('plugins')">Plugins</button>`;
    } else if (m?.kind === 'archived') where = tags([tag('ya la archivaste', 'warn')]);
    else where = tags([tag('no es un archivo tuyo: viene con el agente o de tu cuenta / organización')]);
    return `<tr><td><div class="name">${esc(sk.name)}</div><div class="desc">${esc(sk.description)}</div>${where}</td><td class="n">≈${fmt(sk.tokens)}</td><td><div class="acts">${acts}</div></td></tr>`;
  }).join('');
  return `<h3>Skills en este contexto</h3><div class="card">
    <p style="margin:0 0 8px">${c.skills.length} skills en la lista: <b>≈${fmt(sum)} tokens</b> (${pct(sum, total)} del contexto). El modelo ve solo el nombre y la descripción; el SKILL.md entero entra recién cuando la usa.</p>
    ${c.loaded.length ? `<p class="note">Cargadas completas en esta conversación: ${c.loaded.map((l) => `<b>${esc(l.name)}</b> ≈${fmt(l.tokens)}`).join(', ')}</p>` : ''}
    <table class="t">${rows}</table>
    <p class="note">Archivar una skill la saca de esta lista desde la próxima sesión del agente.</p></div>`;
}

// Pestaña Skills: cuánto ocupa cada una en el contexto según la última sesión que pasó por el logger.
function ctxTag(s) {
  const cs = S.contextSkills;
  if (!cs || !s.enabled) return '';
  const tok = cs.skills[s.name] ?? cs.skills[s.folder];
  const full = cs.loaded.includes(s.folder) || cs.loaded.includes(s.name);
  return (tok != null ? tag('en contexto ≈' + fmt(tok) + ' tokens', 'agent') : '') + (full ? tag('cargada completa en esa sesión') : '');
}
function contextNote() {
  const cs = S.contextSkills;
  if (!cs) return '';
  const n = Object.keys(cs.skills).length, sum = Object.values(cs.skills).reduce((a, b) => a + b, 0);
  return `<div class="card" style="padding:10px 14px">En la última sesión de Claude Code que pasó por el logger (${ago(cs.ts)}: "${esc(cs.title.slice(0, 70))}") el modelo vio <b>${n} skills</b> en la lista,
    <b>≈${fmt(sum)} tokens</b> de ${fmt(cs.ctx)} (${pct(sum, cs.ctx)} del contexto). <button class="link" onclick="location.hash='#/logger/${cs.session}'">Ver ese contexto</button></div>`;
}

// ---------- pedido completo ----------
function showRequest() {
  const r = LR.record, req = r.request || {};
  const sys = typeof req.system === 'string' ? [{ text: req.system }] : req.system || (req.instructions ? [{ text: req.instructions }] : []);
  const msgs = req.messages || req.input || [];
  const tools = req.tools || [];
  $('dlgBody').innerHTML = `<h2 style="font-family:inherit">Pedido de las ${hhmm(r.ts)} · ${esc(req.model || '')}</h2>
    <p class="mono">${esc(r.method)} ${esc(r.path)} → ${r.status} · ${r.ms} ms · ${esc(r.id)}</p>
    <div class="acts" style="justify-content:flex-start"><button onclick="copy(JSON.stringify(LR.record.request, null, 2))">Copiar JSON del pedido</button><button onclick="closeDlg()">Cerrar</button></div>
    <h3>System prompt</h3>${sys.map((b) => `<pre class="small">${esc(clip(b.text))}</pre>`).join('') || '<p class="note">Vacío.</p>'}
    <details><summary><b>Herramientas (${tools.length})</b></summary><table class="t">${tools.map((t) => `<tr><td class="mono">${esc(t.name || t.type)}${t.defer_loading ? ' · diferida' : ''}</td><td class="desc">${esc((t.description || '').slice(0, 220))}</td><td class="n">${fmt(JSON.stringify(t).length)} car.</td></tr>`).join('')}</table></details>
    <h3>Mensajes (${msgs.length})</h3>${msgs.map(renderMsg).join('')}
    <h3>Respuesta</h3>${(r.response?.content || []).map(renderBlock).join('') || `<pre>${esc(r.response?.error || '(vacía)')}</pre>`}
    <details><summary><b>Cabeceras</b> (sin login)</summary><pre class="small">${esc(JSON.stringify(r.headers, null, 2))}</pre></details>`;
  if (!$('dlg').open) $('dlg').showModal();
}
function renderMsg(m) {
  if (m.type && m.type !== 'message') {
    const body = m.arguments ?? m.output ?? m.input ?? m.summary ?? m;
    return `<div class="msg"><div class="who">${esc(m.type)}${m.name ? ' · ' + esc(m.name) : ''}</div><pre class="small">${esc(clip(typeof body === 'string' ? body : JSON.stringify(body, null, 2)))}</pre></div>`;
  }
  const blocks = typeof m.content === 'string' ? [{ type: 'text', text: m.content }] : m.content || [];
  return `<div class="msg"><div class="who">${esc(m.role)}</div>${blocks.map(renderBlock).join('')}</div>`;
}
function renderBlock(b) {
  if (['text', 'input_text', 'output_text'].includes(b.type)) {
    return String(b.text ?? '').split(/(<system-reminder>[\s\S]*?<\/system-reminder>)/).filter((p) => p.trim()).map((p) => p.startsWith('<system-reminder>')
      ? `<details><summary class="note">system-reminder · ${esc(p.slice(17, 100).trim())}…</summary><pre class="small">${esc(clip(p))}</pre></details>`
      : `<pre class="small">${esc(clip(p))}</pre>`).join('');
  }
  if (b.type === 'thinking' || b.type === 'redacted_thinking') return `<details><summary class="note">razonamiento</summary><pre class="small">${esc(clip(b.thinking || b.text || '(cifrado)'))}</pre></details>`;
  if (b.type === 'tool_use' || b.type === 'server_tool_use') return `<div class="note">→ llama a <b>${esc(b.name)}</b></div><pre class="small">${esc(clip(JSON.stringify(b.input, null, 2)))}</pre>`;
  if (b.type === 'tool_result') {
    const c = typeof b.content === 'string' ? b.content : (b.content || []).map((x) => x.text || '[' + x.type + ']').join('\n');
    return `<details><summary class="note">← resultado (${fmt(c.length)} caracteres)${b.is_error ? ' · error' : ''}</summary><pre class="small">${esc(clip(c))}</pre></details>`;
  }
  if (b.type === 'tool_addition') return `<div class="note">+ herramienta agregada: <b>${esc(b.tool?.definition?.name || b.tool?.name || '')}</b></div>`;
  return `<div class="note">[${esc(b.type)}]</div>`;
}

// ---------- teclado ----------
$('q').addEventListener('input', (e) => { q = e.target.value.trim().toLowerCase(); render(); });
$('estado').addEventListener('change', (e) => { estado = e.target.value; render(); });
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== $('q') && !$('dlg').open) { e.preventDefault(); $('q').focus(); }
});
load();
</script>
</body>
